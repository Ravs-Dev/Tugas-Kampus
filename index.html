<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogicDiskrit - Truth Table Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-gradient"></div>
    
    <div class="container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>LogicDiskrit</h1>
                    <span>Truth Table Generator</span>
                </div>
            </div>
            <div class="status-badge">
                <span class="pulse"></span>
                <span>System Active</span>
            </div>
        </header>

        <main class="main-content">
            <section class="input-section">
                <div class="section-header">
                    <h2>Expression Input</h2>
                    <p>Enter your logical expression using P and Q variables</p>
                </div>

                <div class="input-wrapper">
                    <div class="input-field">
                        <span class="input-label">f(x) =</span>
                        <input type="text" id="expression" placeholder="Example: (P ∧ Q) → ¬P" value="(P ∧ Q) → ¬P">
                    </div>
                    <button class="btn-clear" onclick="clearInput()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 6L6 18M6 6l12 12"/>
                        </svg>
                        Clear
                    </button>
                </div>

                <div class="operators-section">
                    <div class="operator-group">
                        <span class="group-label">Variables</span>
                        <div class="operator-buttons">
                            <button onclick="insert('P')" class="btn-operator var">P</button>
                            <button onclick="insert('Q')" class="btn-operator var">Q</button>
                        </div>
                    </div>

                    <div class="operator-group">
                        <span class="group-label">Operators</span>
                        <div class="operator-buttons">
                            <button onclick="insert('¬')" class="btn-operator op">¬ NOT</button>
                            <button onclick="insert(' ∧ ')" class="btn-operator op">∧ AND</button>
                            <button onclick="insert(' ∨ ')" class="btn-operator op">∨ OR</button>
                            <button onclick="insert(' → ')" class="btn-operator op">→ IMPLIES</button>
                            <button onclick="insert(' ↔ ')" class="btn-operator op">↔ IFF</button>
                        </div>
                    </div>

                    <div class="operator-group">
                        <span class="group-label">Symbols</span>
                        <div class="operator-buttons">
                            <button onclick="insert('(')" class="btn-operator sym">(</button>
                            <button onclick="insert(')')" class="btn-operator sym">)</button>
                        </div>
                    </div>
                </div>

                <button class="btn-generate" onclick="generateTable()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2v20M2 12h20"/>
                    </svg>
                    Generate Truth Table
                </button>
            </section>

            <section id="result" class="result-section">
                <!-- Table will be generated here -->
            </section>
        </main>

        <footer class="footer">
            <p>© 2026 LogicDiskrit • Discrete Mathematics Project</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
